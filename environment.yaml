name: f1-wing-deflection
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - pip=25.2
  - python=3.12
  - numpy=1.26.4
  - matplotlib=3.9.2
  - opencv=4.10.0
  - tqdm=4.66.2
  - scikit-image=0.24.0
  - scikit-learn=1.5.2
  - pandas=2.2.3
  - natsort
  - seaborn
  - hydra-core
  - pillow
  - pytorch
  - torchvision
  - torchaudio
  - tensorflow
  - pytorch-cuda=11.8 # adjust to your driver version
  - pip:
      - fastf1==3.3.5
      - git+https://github.com/yformer/EfficientTAM.git@main